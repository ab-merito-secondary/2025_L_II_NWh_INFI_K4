version: 2.1

# CI/CD: build -> test -> lint -> push na Docker Hub -> deploy do Azure Container Apps
# Cała logika jest w Makefile; config wywołuje tylko targety make.
# Deploy: tylko gałąź main, po udanym build-and-test.
# Logowanie do Azure: managed identity + OIDC (bez sekretów).
# Kontekst azure: AZURE_CLIENT_ID, AZURE_TENANT_ID.

jobs:
  build-and-test:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
    environment:
      IMAGE: aleksanderbuczek/hello-world-printer
    steps:
      - checkout
      - run: make deps
      - run: make test
      - run: make lint
      - run: make docker_push TAG=${IMAGE}:${CIRCLE_SHA1}
      - run: make -o docker_build docker_push
      - run: make docker_verify TAG=${IMAGE}:${CIRCLE_SHA1}
  deploy:
    docker:
      - image: mcr.microsoft.com/azure-cli:latest
    steps:
      - checkout
      # - run: make oidc_debug     # podgląd iss/sub/aud tokenu OIDC (diagnostyka)
      - run: make azure_login
      - run: make azure_deploy
      - run: make smoke_test
workflows:
  build-deploy:
    jobs:
      - build-and-test:
         context: dockerhub
      - deploy:
          context: azure
          requires:
            - build-and-test
          filters:
            branches:
              only: master